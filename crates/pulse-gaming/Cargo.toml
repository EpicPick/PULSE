edition.workspace = true
license.workspace = true

[dependencies]
csv = "1.4"
pulse-domain = { path = "../pulse-domain" }

[target.'cfg(windows)'.dependencies]
tempfile = "3"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Diagnostics_Etw", "Win32_System_Performance", "Win32_UI_WindowsAndMessaging"] }
